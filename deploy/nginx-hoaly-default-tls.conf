# Refus des connexions HTTPS qui ne visent pas le domaine du site (scan d'IP, faux nom de domaine).
# Nécessite Nginx 1.19.4 ou plus : install.sh ne l'installe que dans ce cas.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
