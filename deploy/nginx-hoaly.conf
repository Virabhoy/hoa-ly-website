# Site Hoa Ly : Nginx reçoit les visiteurs et transmet au serveur Next.js (port 3000, local uniquement).
# __DOMAIN__ est remplacé par install.sh. Certbot ajoute ensuite le HTTPS et la redirection HTTP -> HTTPS.

# Limitation de débit par adresse IP :
# - connexion à l'admin : 10 essais par minute (le site bloque en plus après 5 échecs) ;
# - optimiseur d'images : 20 images par seconde, de quoi afficher le catalogue mais pas l'épuiser.
limit_req_zone $binary_remote_addr zone=hoaly_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hoaly_images:10m rate=20r/s;
limit_req_status 429;

# Toute requête qui ne vise pas le domaine du site (scan d'IP, faux nom de domaine) est rejetée.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# (Le refus équivalent en HTTPS est dans nginx-hoaly-default-tls.conf, installé si Nginx >= 1.19.4.)

# www.domaine -> domaine (une seule adresse officielle, meilleur pour le référencement).
# La redirection est placée dans « location / » et non au niveau du serveur : Certbot peut ainsi
# ajouter sa propre section pour la vérification Let's Encrypt du certificat de www.
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    server_tokens off;

    location / {
        return 301 $scheme://__DOMAIN__$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Ne pas afficher la version de Nginx.
    server_tokens off;

    # 1 Mo par requête : largement assez pour l'admin, et une protection contre la saturation mémoire.
    client_max_body_size 1m;
    client_body_timeout 15s;

    # En-têtes transmis au site (hérités par toutes les sections ci-dessous).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # On remplace (et non complète) l'en-tête : un visiteur ne peut pas se faire passer pour une autre IP
    # et contourner la limite de tentatives de connexion à l'admin.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;

    location = /api/auth/login {
        limit_req zone=hoaly_login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3000;
    }

    # Envoi de photos depuis l'admin : 15 Mo maximum côté site, marge pour l'envoi.
    location = /api/admin/upload {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
    }

    location /_next/image {
        limit_req zone=hoaly_images burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
